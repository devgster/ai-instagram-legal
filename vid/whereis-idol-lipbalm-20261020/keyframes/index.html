<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수사의 일부분 · 키프레임 검수</title><style>body{margin:0;background:#0b101a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:480px;margin:auto;padding:18px}h1{font-size:23px;margin:15px 0 5px}p{line-height:1.5;color:#c3cede}section{margin:24px 0;background:#172030;border-radius:14px;overflow:hidden}img{width:100%;display:block}h2{font-size:17px;margin:14px}.note{padding:0 14px 16px;color:#c3cede;font-size:14px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#2e4768;color:#fff;font-size:12px}</style></head><body><main><span class="badge">키프레임 3장 · 영상 렌더 대기</span><h1>수사의 일부분</h1><p>32.5초 숏드라마의 시작 장면입니다. 같은 유나와 침실, 새로운 형사 배우의 얼굴·시선·거리감을 확인해 주세요.</p><section><h2>01 · 잠든 유나 / 열린 문</h2><img src="C01_opening.jpg" alt="잠든 유나와 문틈의 그림자"><div class="note">0–2초 오프닝. 그림자가 한 화면에 보이는 훅.</div></section><section><h2>03 · 그림자를 본 유나</h2><img src="C03_scream.jpg" alt="그림자를 본 유나"><div class="note">3.5–5초 비명 직전. 영상에서는 비명이 터집니다.</div></section><section><h2>04 · 형사의 첫 질문</h2><img src="C04_first_dialogue.jpg" alt="유나와 형사의 첫 조사"><div class="note">형사 “몇 시쯤이었죠?” — 이 첫 발화 영상만 우선 제작 중입니다.</div></section><p>이 페이지는 이미지 검수본입니다. 실제 음성·연기 영상은 렌더 완료 후 별도 페이지로 제공됩니다.</p></main></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수사의 일부분 · 배우·배경 정본</title><style>body{margin:0;background:#0b101a;color:white;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:480px;margin:auto;padding:18px}h1{font-size:23px}p{line-height:1.55;color:#ccd5e2}section{background:#172030;border-radius:14px;overflow:hidden;margin:23px 0}h2{font-size:18px;margin:14px}img{width:100%;display:block}.note{padding:0 14px 15px;color:#ccd5e2;font-size:14px}.badge{display:inline-block;background:#2c4768;border-radius:99px;padding:5px 9px;font-size:12px}</style></head><body><main><span class="badge">수정 정본 · 키프레임 미사용</span><h1>수사의 일부분</h1><p>영상 생성의 기본 참조는 새 배우 2명과 침실 배경입니다. 유나는 침입 순간에만 잠옷이고, 형사가 온 조사 장면부터는 평상복입니다.</p><section><h2>01 · 유나 / 조사 장면 평상복</h2><img src="yuna_daywear.jpg" alt="유나 배우 정본 평상복"><div class="note">크림색 니트·청바지. 잠옷 장면과 같은 배우 얼굴.</div></section><section><h2>02 · 형사 배우 정본</h2><img src="detective_sheet.jpg" alt="형사 배우 정본"><div class="note">차콜 재킷·회색 셔츠. 이번 회차 새 배우.</div></section><section><h2>03 · 불 켜진 침실 배경</h2><img src="bedroom_lit.jpg" alt="조사 장면 침실 배경"><div class="note">경찰 도착 후 조명이 켜진 같은 침실.</div></section><p>이 세 이미지로 H3 Omni 첫 대사 컷을 다시 제작 중입니다.</p></main></body></html>
